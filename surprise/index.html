<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#075b43"><title>مفاجأة بزار | كل شيء بالمعقول</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(180deg,#effaf5,#fff,#fff8e7);color:#17352d;display:grid;place-items:center;padding:16px}.card{width:min(100%,440px);background:#fff;border:1px solid #e8eee9;border-radius:28px;overflow:hidden;box-shadow:0 18px 60px #123b2a1c}.hero{padding:30px 22px 25px;text-align:center;color:#fff;background:linear-gradient(145deg,#075b43,#087653,#c99a32)}.gift{width:72px;height:72px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#ffffff20;border:1px solid #ffffff45;font-size:38px}.eyebrow{margin:12px 0 0;font-size:12px;font-weight:800}.hero h1{margin:5px 0 0;font-size:30px}.hero p{margin:8px 0 0;font-size:14px;line-height:1.8}.body{padding:24px;text-align:center}.media{margin:0 auto 18px;max-width:190px}.media img{width:100%;display:block;border-radius:18px}.body h2{font-size:21px;margin:7px 0;color:#075b43}.body p{font-size:13px;line-height:1.9;color:#64746e;margin:0 0 18px}.claim,.link{display:block;width:100%;border:0;cursor:pointer;background:#075b43;color:#fff;padding:14px 18px;border-radius:16px;font:inherit;font-weight:900;font-size:16px;text-decoration:none;box-shadow:0 8px 22px #075b4330}.claim:disabled{opacity:.65;cursor:wait}.result{display:none;margin-top:16px;padding:18px;border-radius:18px;background:#f5faf7;border:1px solid #dcebe3}.result.win,.result.lost,.result.error{display:block}.result.lost{background:#fff9ed;border-color:#f0dfb4}.result.error{background:#fff1f2;border-color:#fecdd3}.result h3{margin:0 0 7px;font-size:19px}.result p{margin:0;color:#52635d}.prize{margin:14px 0;padding:14px;border-radius:14px;background:#fff;border:1px dashed #c99a32;font-weight:800;color:#075b43}.note{font-size:11px!important;color:#94a39d!important;margin-top:15px!important;margin-bottom:0!important}.small{font-size:11px;color:#94a39d;margin-top:12px}</style></head><body><main class="card"><section class="hero"><div class="gift">🎁</div><div class="eyebrow">بزار كل شيء بالمعقول</div><h1 id="title">مفاجأة بزار</h1><p id="headline">🎁 افتح المفاجأة… وقد تكون من الفائزين!</p></section><section class="body"><div id="media"></div><h2 id="sub">🎉 مفاجأة خاصة</h2><p id="description"></p><button class="claim" id="claim">استلم المفاجأة 🎁</button><div class="result" id="result"></div><div class="small" id="limit"></div><p class="note">يمكن تغيير نوع المفاجأة أو الرابط أو الصورة أو الجائزة لاحقًا مع الإبقاء على رمز QR نفسه.</p></section></main><script src="config.js"></script><script>(()=>{const c=window.SURPRISE_CONFIG||{};const key='belma3qoul_surprise_'+(c.campaignId||'default');const API='https://countapi.mileshilliard.com/api/v1/hit/'+encodeURIComponent(key);const $=id=>document.getElementById(id),claim=$('claim'),result=$('result');$('title').textContent=c.title||'مفاجأة بزار';$('headline').textContent=c.headline||'🎁 افتح المفاجأة… وقد تكون من الفائزين!';$('description').textContent=c.description||'';$('limit').textContent=`عدد الفائزين في هذه الجولة: ${c.maxWinners||1}`;if(c.imageUrl){$('media').innerHTML=`<div class="media"><img src="${c.imageUrl}" alt="المفاجأة"></div>`}else if(c.externalLink){$('media').innerHTML=`<a class="link" href="${c.externalLink}" target="_blank" rel="noopener">فتح المفاجأة 🔗</a>`}if(c.enabled===false){claim.disabled=true;claim.textContent='الجولة متوقفة حاليًا'}function show(cls,title,text,prize){result.className='result '+cls;result.innerHTML=`<h3>${title}</h3><p>${text}</p>${prize?`<div class="prize">${prize}</div>`:''}`}claim.addEventListener('click',async()=>{if(claim.disabled)return;claim.disabled=true;claim.textContent='جارٍ التحقق…';try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json(),n=Number(d.value);if(n<=Number(c.maxWinners||1)){localStorage.setItem(key,'1');show('win',c.winnerText||'🎉 مبروك! أنت من الفائزين',c.winnerDescription||'تم تسجيل مطالبتك بنجاح.',`${c.prizeTitle||'🎁 الجائزة'}: ${c.prizeText||'مفاجأة خاصة من بزار كل شيء بالمعقول'}`);claim.textContent='تم تسجيل المطالبة ✓'}else{show('lost',c.endedText||'😔 انتهت المفاجأة',c.endedDescription||'سبقك فائز آخر وحصل على الجائزة.');claim.textContent='انتهت هذه الجولة'}}catch(e){claim.disabled=false;claim.textContent=c.actionText||'استلم المفاجأة 🎁';show('error','تعذر التحقق الآن','حدث خطأ مؤقت في خدمة التحقق. حاول مرة أخرى بعد قليل.')}})})();</script></body></html>
