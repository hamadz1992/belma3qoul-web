name: Publish Surprise Page

on:
  push:
    branches: [main]
    paths:
      - 'surprise/**'
      - 'bazaar_balanced_logo_final-5.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site/landing
          cp -R surprise/. _site/
          cp bazaar_balanced_logo_final-5.html _site/landing/index.html
      - name: Upload pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
          name: surprise-pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: surprise-pages

# The original Bazaar landing page is copied unchanged to /landing/.